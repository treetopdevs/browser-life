<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Social card · Cadence Garden</title>
    <link rel="stylesheet" href="/src/social-card.css" />
  </head>
  <!-- Dev only (not a build input): scripts/social-cards.ts screenshots this page at 1200 by 630 for each world. -->

    <main class="card">

        <ul class="chips" id="chips"></ul>

    <script type="module" src="/src/social-card.ts"></script>
