services:
  site:
    image: browser-life-site:${BL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.site
    restart: unless-stopped
    environment:
      # Space-separated CIDRs of the proxies Caddy believes about X-Forwarded-For
      # (deploy/README.md). Empty trusts none: every visitor is then one address.
      BL_TRUSTED_PROXY_CIDRS: ${BL_TRUSTED_PROXY_CIDRS:-}
    expose:
      - "80"
    depends_on:
      - coordinator

  coordinator:
    image: browser-life-coordinator:${BL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    restart: unless-stopped
    stop_grace_period: 75s
    environment:
      PHX_SERVER: "true"
      PHX_HOST: cadence.garden
      PORT: "4000"
      # This release publishes the lab, while garden scheduling stays off.
      BL_GARDEN_SCHEDULING: "off"
      BL_DATA_DIR: /data
      # The discovery plane (Coordinator.Discovery) refuses a directory inside
      # BL_DATA_DIR, and the release default `data-discovery` resolves to the
      # read-only /app; it gets its own volume.
      BL_DISCOVERY_DATA_DIR: /data-discovery
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in Dokploy}
      BL_ADMIN_TOKEN: ${BL_ADMIN_TOKEN:?Set BL_ADMIN_TOKEN in Dokploy}
      # Discovery workers join with this token. Without it the plane admits
      # loopback clients only, and behind Caddy no request is loopback.
      BL_DISCOVERY_JOIN_TOKEN: ${BL_DISCOVERY_JOIN_TOKEN:?Set BL_DISCOVERY_JOIN_TOKEN in Dokploy}
      # Optional; blank keeps the coordinator's own default (deploy/README.md says
      # what each does and which must be set together).
      BL_TRUST_FORWARDED_FOR: ${BL_TRUST_FORWARDED_FOR:-}
      BL_ISLAND_JOINS_PER_ADDRESS: ${BL_ISLAND_JOINS_PER_ADDRESS:-}
      BL_MAX_ISLANDS: ${BL_MAX_ISLANDS:-}
      BL_CORS_ORIGINS: ${BL_CORS_ORIGINS:-}
      BL_LEASE_MS: ${BL_LEASE_MS:-}
    volumes:
      - coordinator_data:/data
      - discovery_data:/data-discovery

volumes:
  coordinator_data:
  discovery_data:
